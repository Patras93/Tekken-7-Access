name: Build Online Practice Probe

on:
  push:
    branches:
      - feature/online-practice-probe
  pull_request:
    paths:
      - 'online-practice/**'
      - '.github/workflows/build-online-practice-probe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          if not defined VS_PATH exit /b 1
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd online-practice
          call BUILD_X64.bat
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: T7OnlinePracticeProbe
          path: online-practice/T7OnlinePracticeProbe.exe
