name: Build Online Practice Probe

on:
  push:
    branches:
      - feature/online-practice-probe
  pull_request:
    paths:
      - 'online-practice/**'
      - '.github/workflows/build-online-practice-probe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd online-practice
          call BUILD_X64.bat
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: T7OnlinePracticeProbe
          path: online-practice/T7OnlinePracticeProbe.exe
